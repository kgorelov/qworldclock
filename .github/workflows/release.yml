name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          cache: true

      - name: Build application
        run: pixi run build

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test

      - name: Package Linux
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist package/qworldclock
          cp build/qworldclock package/qworldclock/
          TAG_NAME="${GITHUB_REF_NAME//\//-}"
          tar -czvf "dist/qworldclock-${TAG_NAME}-linux-x64.tar.gz" -C package qworldclock

      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          mkdir -p dist package/qworldclock
          cp build/qworldclock.exe package/qworldclock/
          cp build/*.dll package/qworldclock/
          cp -r build/platforms package/qworldclock/
          TAG_NAME="${GITHUB_REF_NAME//\//-}"
          cmake -E chdir package cmake -E tar cfv "../dist/qworldclock-${TAG_NAME}-windows-x64.zip" --format=zip qworldclock

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qworldclock-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qworldclock-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
