name: Release

on:
  push:
    branches:
      - 'release/**'
      - 'release-*'
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: latest
          cache: true

      - name: Configure CMake
        run: pixi run configure

      - name: Build application
        run: pixi run build

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pixi run test

      - name: Package Linux
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME//\//-}"

          # 1. Dynamic tarball (requires Qt6 on host)
          mkdir -p package_qt6/qworldclock
          cp build/qworldclock package_qt6/qworldclock/
          tar -czvf "dist/qworldclock-${TAG_NAME}-linux-x86_64-qt6.tar.gz" -C package_qt6 qworldclock

          # 2. Build AppImage and AppDir via pixi task
          pixi run appimage

          # 3. Copy generated AppImage to dist
          cp QWorldClock-x86_64.AppImage "dist/qworldclock-${TAG_NAME}-linux-x86_64.AppImage"

          # 4. Standalone bundle tarball (bundles all Qt libraries & plugins)
          mkdir -p package_bundle/qworldclock
          cp -a AppDir/* package_bundle/qworldclock/
          cat << 'EOF' > package_bundle/qworldclock/qworldclock
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/qworldclock" "$@"
          EOF
          chmod +x package_bundle/qworldclock/qworldclock
          tar -czvf "dist/qworldclock-${TAG_NAME}-linux-x86_64-bundle.tar.gz" -C package_bundle qworldclock

      - name: Package Windows
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          mkdir -p dist package/qworldclock
          cp build/qworldclock.exe package/qworldclock/
          cp build/*.dll package/qworldclock/
          cp -r build/platforms package/qworldclock/
          TAG_NAME="${GITHUB_REF_NAME//\//-}"
          cmake -E chdir package cmake -E tar cfv "../dist/qworldclock-${TAG_NAME}-windows-x64.zip" --format=zip qworldclock

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qworldclock-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qworldclock-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
