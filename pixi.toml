[workspace]
name = "qworldclock"
version = "0.1.0"
description = "Multi-timezone world clock desktop application for distributed teams"
authors = ["Kirill Gorelov <kgorelov@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
cmake = ">=3.22"
ninja = ">=1.11"
cxx-compiler = ">=1.8"
qt6-main = ">=6.5"
tomlplusplus = ">=3.3"

[tasks]
configure = "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
run = { cmd = "./build/qworldclock", depends-on = ["build"] }
appimage = { cmd = "scripts/build_appimage.sh", depends-on = ["build"] }
